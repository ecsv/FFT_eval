name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # osx native build
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      MAKE_FLAGS: V=s
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install pkgconf sdl2 sdl2_ttf
      - name: Build and test
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS} test
