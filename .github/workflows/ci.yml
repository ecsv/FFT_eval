name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.sdl.name }}, ${{ matrix.variant.name }})
    runs-on: ubuntu-latest
    # ubuntu-latest doesn't provide SDL3 packages
    container:
      image: debian:trixie
      # required by LeakSanitizer
      options: --cap-add=SYS_PTRACE --security-opt seccomp=unconfined
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang
        sdl:
          - name: SDL3
            config: "y"
          - name: SDL2
            config: "n"
        variant:
          - name: coverage
            cflags: "--coverage"
          - name: O3
            cflags: "-O3"
          - name: valgrind
            cflags: "-O1 -g3"
            testrun_wrapper: "valgrind -q --error-exitcode=126 --track-origins=yes --leak-check=full"
          - name: sanitizers
            cflags: "-g3 -fsanitize=undefined -fsanitize=address -fsanitize=leak -fno-sanitize-recover=undefined"
    env:
      CC: ${{ matrix.compiler }}
      CFLAGS: ${{ matrix.variant.cflags }}
      TESTRUN_WRAPPER: ${{ matrix.variant.testrun_wrapper }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            make gcc clang libclang-rt-dev libc6-dev pkg-config valgrind \
            libsdl3-dev libsdl3-ttf-dev libsdl2-dev libsdl2-ttf-dev
      - name: Build and test
        run: make clean && make -j"$(nproc)" CONFIG_SDL3=${{ matrix.sdl.config }} test

  # test fallback to SDL2 when SDL3 is not installed
  linux-sdl2-fallback:
    name: Linux (SDL2 fallback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libsdl2-dev libsdl2-ttf-dev
      - name: Build and test
        run: make clean && make -j"$(nproc)" test
      - name: Check used SDL version
        run: ldd fft_eval_sdl | grep libSDL2_ttf

  # test without sdl installed
  linux-no-sdl:
    name: Linux (without SDL)
    runs-on: ubuntu-latest
    env:
      MAKE_FLAGS: CONFIG_fft_eval_sdl=n CONFIG_fft_eval_json=y V=s
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS} test

  # windows native build
  windows:
    name: Windows (MSYS2 ${{ matrix.msystem }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        msystem:
          - UCRT64
          - MINGW64
    defaults:
      run:
        shell: msys2 {0}
    env:
      MAKE_FLAGS: V=s
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: make which
          pacboy: >-
            gcc:p
            pkgconf:p
            sdl3:p
            sdl3-ttf:p
            SDL2:p
            SDL2_ttf:p
      - name: Build (SDL3)
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS} CONFIG_SDL3=y
      - name: Build (SDL2)
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS} CONFIG_SDL3=n

  # osx native build
  macos:
    name: macOS
    runs-on: macos-latest
    env:
      MAKE_FLAGS: V=s
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: brew install pkgconf sdl3 sdl3_ttf sdl2 sdl2_ttf
      - name: Build and test (SDL3)
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS} CONFIG_SDL3=y test
      - name: Build and test (SDL2)
        run: make ${MAKE_FLAGS} clean && make ${MAKE_FLAGS} CONFIG_SDL3=n test

  # reuse test
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v5
